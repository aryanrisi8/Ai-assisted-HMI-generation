services:
  postgres:
    image: postgres:16-alpine
    container_name: hmi-postgres
    environment:
      POSTGRES_DB: hmi_platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hmi_platform"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: hmi-backend
    environment:
      APP_ENV: development
      DEBUG: "true"
      LOG_FORMAT: json
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/hmi_platform
      JWT_SECRET_KEY: local-development-secret-change-me
      BACKEND_CORS_ORIGINS: '["http://localhost:5173","http://localhost:3000"]'
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: hmi-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
