services:
  - type: web
    name: hmi-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: false
      - key: LOG_FORMAT
        value: json
      - key: API_V1_PREFIX
        value: /api/v1
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: hmi-postgres
          property: connectionString
      - key: BACKEND_CORS_ORIGINS
        sync: false

databases:
  - name: hmi-postgres
    databaseName: hmi_platform
    user: hmi_user
